apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.fullname" . }}-secret
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
data:
  mongo-root-username: {{ .Values.auth.rootUsername | b64enc | quote }}
  mongo-root-password: {{ .Values.auth.rootPassword | b64enc | quote }}
