# Default values for mongo-express.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: mongo-express
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

mongodb:
  # MongoDB connection details
  host: "mongodb-service"  # This should match the MongoDB service name
  secretName: "mongodb-secret"  # Reference to MongoDB secret

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

nodePort:
  enabled: true
  port: 30081

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}
