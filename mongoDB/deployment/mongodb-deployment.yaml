# cycode_ignore_violation_for_resource_here Local k3d development environment only, not used in production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  namespace: local-stack
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Create keyFile for replica set authentication
          openssl rand -base64 756 > /tmp/mongodb-keyfile
          chmod 400 /tmp/mongodb-keyfile
          chown mongodb:mongodb /tmp/mongodb-keyfile

          # Start MongoDB with replica set (without auth first for init)
          mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongodb-keyfile &
          MONGOD_PID=$!

          # Wait for MongoDB to start
          sleep 5

          # Initialize replica set with service DNS name (required for cross-pod connectivity)
          mongosh --eval "
            try {
              rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb-service.local-stack:27017'}]});
              print('Replica set initialized');
            } catch (e) {
              if (e.codeName === 'AlreadyInitialized') {
                print('Replica set already initialized');
              } else {
                print('Error: ' + e.message);
              }
            }
          " || true

          # Wait for replica set to be ready
          sleep 3

          # Create admin user
          mongosh --eval "
            try {
              db = db.getSiblingDB('admin');
              db.createUser({
                user: '$MONGO_INITDB_ROOT_USERNAME',
                pwd: '$MONGO_INITDB_ROOT_PASSWORD',
                roles: ['root']
              });
              print('Admin user created');
            } catch (e) {
              print('User may already exist: ' + e.message);
            }
          " || true

          # Keep container running
          wait $MONGOD_PID
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongo-root-password
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: local-stack
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
