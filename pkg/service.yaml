apiVersion: v1
kind: Service
metadata:
  name: aisecurity-mgmt-service-service
  namespace: local-stack
  labels:
    app: aisecurity-mgmt-service
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
    protocol: TCP
    name: http
  - port: 9000
    targetPort: 9000
    nodePort: 30090
    protocol: TCP
    name: metrics
  selector:
    app: aisecurity-mgmt-service