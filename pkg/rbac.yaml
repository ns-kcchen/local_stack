---
# ServiceAccount for AISecurityService Profile API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aisecurity-mgmt-sa
  namespace: local-stack
  labels:
    app: aisecurity-mgmt-service
---
# Role: Read-only access to pod information
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: local-stack
  labels:
    app: aisecurity-mgmt-service
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
# RoleBinding: Bind ServiceAccount to Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aisecurity-mgmt-pod-reader
  namespace: local-stack
  labels:
    app: aisecurity-mgmt-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
subjects:
- kind: ServiceAccount
  name: aisecurity-mgmt-sa
  namespace: local-stack
