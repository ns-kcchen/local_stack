# Default values for mongodb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: mongo
  pullPolicy: IfNotPresent
  tag: "4.4"  # Use specific version that supports transactions

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

auth:
  rootUsername: "username"  # base64: dXNlcm5hbWU=
  rootPassword: "password"  # base64: cGFzc3dvcmQ=

# Replica Set configuration for transaction support
replicaSet:
  enabled: true
  name: "rs0"
  # For development, we use a single-node replica set
  # In production, you would have multiple replicas

service:
  type: ClusterIP
  port: 27017
  targetPort: 27017

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  enabled: false
  # storageClass: ""
  # accessMode: ReadWriteOnce
  # size: 8Gi
