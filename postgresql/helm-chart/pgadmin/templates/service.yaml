apiVersion: v1
kind: Service
metadata:
  name: {{ include "pgadmin.fullname" . }}-service
  labels:
    {{- include "pgadmin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: pgadmin
  selector:
    {{- include "pgadmin.selectorLabels" . | nindent 4 }}
